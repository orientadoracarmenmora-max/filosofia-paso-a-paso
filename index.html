function practicarExamen(id) {
 const [titulo,banco] = recorridosExamen[id];
 const borradores = banco.map(()=>'');
 let actual = 0;
 main.innerHTML = cabecera('Qué tengo que saber para el examen',titulo,'Lee, completa la frase y mira el ejemplo.') +
 boton('Volver a la guía de examen','inicio') + '<section id="pregunta-examen" class="panel"></section>';
 const panel = document.querySelector('#pregunta-examen');
 function mostrar(mover = true) {
  const [tipo,pregunta,inicioFrase,ejemplo,ayuda] = banco[actual];
  const frase = inicioFrase.replaceAll('…',' ___');
  panel.innerHTML = `${contador(actual,banco.length)}<p class="kicker">${tipo}</p>
   <h2 id="consigna-examen" tabindex="-1">${pregunta}</h2>
   <details><summary>Ver explicación fácil</summary><p>${ayuda}</p></details>
   <p><strong>Frase con huecos</strong><br>${frase}</p>
   <button type="button" id="usar-examen">Poner la frase en mi respuesta</button>
   <label class="campo-examen" for="texto-examen"><strong>Mi respuesta</strong></label><textarea id="texto-examen" aria-describedby="consigna-examen"></textarea>
   <details><summary>Ver ejemplo corto</summary><p>${ejemplo}</p></details>
   <div class="acciones">
    ${actual>0?'<button type="button" id="prev-examen">Anterior</button>':''}
    ${actual<banco.length-1?'<button type="button" id="next-examen" class="primario">Siguiente pregunta</button>':boton('Terminar y volver a la guía','inicio',true)}
   </div>`;
  const area = panel.querySelector('textarea');
  area.value = borradores[actual];
  area.oninput = () => { borradores[actual] = area.value; };
  panel.querySelector('#usar-examen').onclick = () => {
   const inicio = area.value.length + (area.value ? 1 : 0);
   area.value += (area.value ? '\n' : '') + frase;
   borradores[actual] = area.value;
   area.focus();
   const hueco = area.value.indexOf('___',inicio);
   if (hueco >= 0) area.setSelectionRange(hueco,hueco+3);
  };
  const anterior = panel.querySelector('#prev-examen');
  if (anterior) anterior.onclick = () => { actual--; mostrar(); };
  const siguiente = panel.querySelector('#next-examen');
  if (siguiente) siguiente.onclick = () => { actual++; mostrar(); };
  if (mover) panel.querySelector('h2').focus();
 }
 mostrar(false);
}

  `<article class="tarjeta"><p class="kicker">${u.tema}</p><h3>${u.titulo}</h3><p>${u.resumen}</p>${boton('Abrir ' + u.titulo.toLowerCase(),u.id,true)}</article>`
 ).join('') + '</div>' +
 `<section class="panel"><h2>Cómo usar la aplicación</h2><ol class="pasos"><li>Lee la idea clave y abre el ejemplo.</li><li>Practica una pregunta cada vez. Puedes volver a intentarlo.</li><li>Escribe una respuesta y revísala con el modelo.</li></ol><p>Las preguntas sirven para ensayar lo trabajado en clase. Puedes hacerlas a tu ritmo.</p>${boton('Ir al taller de respuestas','taller')}</section>`;
}
function esquema(u) {
 main.innerHTML = cabecera(u.tema,u.titulo,u.resumen) + opcionesUnidad(u) +
 '<section class="panel"><h2>Lo imprescindible</h2>' + u.fichas.map(([titulo,clave,exp,ej]) =>
  `<article class="ficha"><h3>${titulo}</h3><p class="clave">${clave}</p><details><summary>Ver explicación y ejemplo</summary><p>${exp}</p><p><strong>Ejemplo resuelto.</strong> ${ej}</p></details></article>`
 ).join('') + '</section>' + fuente(u.fuente);
}
function cuestionario(u,nivel) {
 const banco = u.preguntas.filter(q => q[0] === nivel);
 let actual = 0;
 let aciertos = new Set();
 main.innerHTML = cabecera(u.titulo,nivel === 1 ? 'Reconocer' : 'Aplicar','Elige una respuesta y comprueba la razón.') + opcionesUnidad(u) +
 '<section id="turno" class="panel"></section>';
 const turno = document.querySelector('#turno');
 function mostrar(mover = true) {
  if (actual === banco.length) {
   turno.innerHTML = `<h2 tabindex="-1">Práctica terminada</h2><p>${aciertos.size} de ${banco.length} preguntas resueltas correctamente durante el recorrido.</p><div class="acciones"><button type="button" id="repetir">Volver a practicar</button>${boton(nivel === 1 ? 'Pasar a aplicar' : 'Pasar a escribir',u.id + '/' + (nivel + 1),true)}</div>`;
   turno.querySelector('button').onclick = () => { actual = 0; aciertos = new Set(); mostrar(); };
   turno.querySelector('h2').focus();
   return;
  }
  const [,pregunta,alternativas,clave,exp] = banco[actual];
  turno.innerHTML = contador(actual,banco.length) +
    `<form><fieldset><legend tabindex="-1">${pregunta}</legend>${alternativas.map((texto,i)=>
     `<label class="opcion"><input type="radio" name="respuesta" value="${i}"> ${texto}</label>`).join('')}</fieldset>
     <div class="acciones"><button class="primario" type="submit">Comprobar</button><button type="button" id="solucion">Ver solución</button><button type="button" id="siguiente" hidden>Siguiente</button></div>
     <div class="estado" role="status"></div></form>`;
  const form = turno.querySelector('form');
  const estado = turno.querySelector('[role=status]');
  const siguiente = turno.querySelector('#siguiente');
  const solucion = turno.querySelector('#solucion');
  function resolver(mensaje) {
   estado.textContent = mensaje + ' ' + exp;
   siguiente.hidden = false;
  }
  form.onsubmit = evento => {
   evento.preventDefault();
   const marcada = form.querySelector('input:checked');
   if (!marcada) { estado.textContent = 'Elige una opción antes de comprobar.'; return; }
   if (Number(marcada.value) === clave) {
    aciertos.add(actual);
    resolver('Correcto.');
   } else {
    estado.textContent = 'Revisa tu elección. Pista: ' + exp + ' Prueba otra opción.';
   }
  };
  solucion.onclick = () => resolver('Respuesta: ' + alternativas[clave] + '.');
  siguiente.onclick = () => { actual++; mostrar(); };
  if (mover) turno.querySelector('legend').focus();
 }
 mostrar(false);
}
function escribir(u) {
 main.innerHTML = cabecera(u.titulo,'Escribir una respuesta','Formula tu respuesta y compárala con el modelo.') + opcionesUnidad(u) +
 `<section class="panel"><label for="consigna"><strong>Elige una pregunta</strong></label>
 <select id="consigna">${u.escritura.map(([p],i)=>`<option value="${i}">Pregunta ${i+1}</option>`).join('')}</select>
 <p class="kicker">Tu texto se conserva al cambiar de pregunta en esta pantalla. Cópialo antes de salir.</p><div id="respuesta"></div></section>` + fuente(u.fuente);
 const select = document.querySelector('#consigna');
 const panel = document.querySelector('#respuesta');
 const borradores = [];
 function mostrar() {
  const i = Number(select.value);
  const [pregunta,pista,modelo,revision] = u.escritura[i];
  panel.innerHTML = `<h2 id="pregunta">${pregunta}</h2><details><summary>Ver ayuda para empezar</summary><p>${pista}</p></details>
    <label for="borrador"><strong>Mi respuesta</strong></label><textarea id="borrador" aria-describedby="pregunta"></textarea>
    <details><summary>Ver modelo y revisar</summary><p>${modelo}</p><p><strong>Comprueba tu respuesta.</strong> ${revision}</p></details>`;
  const area = panel.querySelector('textarea');
  area.value = borradores[i] || '';
  area.oninput = () => { borradores[i] = area.value; };
 }
 select.onchange = mostrar;
 mostrar();
}
function listadoTaller() {
 main.innerHTML = cabecera('Escritura y expresión oral','Taller de respuestas','Prepara una tarea con un guion. Abre un modelo cuando lo necesites.') +
 '<div class="rejilla">' + talleres.map(t =>
  `<article class="tarjeta"><h2>${t.titulo}</h2><p>${t.pregunta}</p>${boton('Abrir guion','taller/' + t.id,true)}</article>`
 ).join('') + '</div>';
}
const frasesDisertacion = {
 'dis-mito': [
  ['Di de qué vas a hablar y qué respuesta vas a defender. Esa respuesta es tu tesis.','En este texto voy a responder a esta pregunta: ___. Yo pienso que ___.','En este texto voy a responder si el logos rompió con el mito. Yo pienso que el cambio fue gradual.','ruptura · cambio gradual'],
  ['Da una primera razón. Usa un ejemplo del tema para explicarla.','Mi primera razón es que ___. Por ejemplo, ___.','Mi primera razón es que se mantuvo la pregunta por el origen. Por ejemplo, los primeros filósofos buscaron ese origen en un principio natural, el arjé.','origen · arjé · principio natural'],
  ['Da una segunda razón. Elige una idea distinta de la primera.','Mi segunda razón es que ___. Esto muestra que ___.','Mi segunda razón es que Platón seguía usando mitos. Esto muestra que los mitos pudieron convivir con los argumentos.','Platón · mito · argumento'],
  ['Imagina que alguien no está de acuerdo. Escribe qué diría y contéstale. Eso es responder a una objeción.','Alguien podría decir que ___. Yo respondería que ___.','Alguien podría decir que buscar causas naturales supuso una ruptura. Yo respondería que cambiaron las explicaciones, aunque algunas preguntas siguieron siendo las mismas.','causa natural · tradición · continuidad'],
  ['Vuelve a la pregunta. Resume lo que has defendido.','En conclusión, pienso que ___ porque ___.','En conclusión, pienso que fue un cambio gradual porque convivieron los mitos y las explicaciones razonadas.','cambio gradual · explicación razonada']
 ],
 'dis-amor': [
  ['Escribe la pregunta y elige una respuesta. Esa respuesta es tu tesis.','En este texto voy a responder a esta pregunta: ___. Creo que al amar lo más importante es ___.','En este texto voy a responder a esta pregunta: ¿qué es lo más importante al amar? Creo que lo más importante es reconocer a la otra persona.','amar · reconocer al otro'],
  ['Escribe una idea de cada autor. Después escribe algo que compartan y algo en que se diferencien.','Para Aristófanes, ___. Para Diotima, ___. Para Weil, ___. Los dos primeros coinciden en ___. Se diferencian en ___.','Aristófanes habla de recuperar la unidad perdida. Diotima habla de buscar el bien y la belleza. Weil habla de prestar atención al otro. Los dos primeros coinciden en que el amor tiene que ver con una falta. Se diferencian en lo que buscamos.','unidad perdida · falta · bien y belleza · atención'],
  ['Explica por qué estás de acuerdo con una de las ideas. Piensa en una situación concreta.','La idea de ___ me convence porque ___. Por ejemplo, ___.','La idea de Weil me convence porque escuchar ayuda a convivir. Por ejemplo, puedo intentar entender a alguien aunque pensemos distinto.','escuchar · comprender · discrepar'],
  ['Imagina qué diría alguien que piensa distinto. Eso es una objeción. Después contéstale.','Alguien podría decir que ___. Yo respondería que ___.','Alguien podría decir que también escuchamos a personas a las que no amamos. Yo respondería que escuchar no explica por sí solo el amor, pero ayuda a cuidar una relación.','atracción · cuidado · atención'],
  ['Responde otra vez a la pregunta y resume tu razón principal.','En conclusión, para mí amar es sobre todo ___ porque ___.','En conclusión, para mí amar es sobre todo reconocer al otro porque así puedo cuidar la relación y respetar sus decisiones.','reconocer · cuidar · respetar']
 ]
};

function taller(t) {
 const borrador = t.pasos.map(() => '');
 const frases = frasesDisertacion[t.id];
 let actual = 0;
 main.innerHTML = cabecera('Taller de respuestas',t.titulo,t.pregunta) +
 `<p>${t.detalle}</p><details class="panel"><summary>Ver todos los pasos</summary><ol class="pasos">${t.pasos.map(([nombre])=>`<li>${nombre}</li>`).join('')}</ol></details>
 ${frases ? '<p><strong>Empieza por una frase.</strong> Puedes copiar el inicio y rellenar los huecos. El ejemplo corto te enseña cómo. Amplía cada parte cuando tengas las ideas claras.</p>' : ''}
 <section id="pasos-taller" class="panel"></section>` + fuente(t.fuente) + boton('Volver al taller','taller');
 const panel = document.querySelector('#pasos-taller');
 const palabras = texto => (texto.match(/[\p{L}\p{N}]+(?:[’'-][\p{L}\p{N}]+)*/gu) || []).length;
 function mostrar(mover = true) {
  if (actual === t.pasos.length) {
   panel.innerHTML = `<h2 tabindex="-1">Revisa tu trabajo</h2>
   <label for="texto-final"><strong>Texto reunido</strong></label>
   <textarea id="texto-final" readonly rows="11"></textarea>
   ${t.rango ? `<p>${palabras(borrador.join(' '))} palabras. Extensión de la tarea: ${t.rango.join('–')} palabras.</p>` : ''}
   <details><summary>Ver modelo completo</summary>${t.pasos.map(([nombre,,modelo])=>`<h3>${nombre}</h3><p>${modelo}</p>`).join('')}</details>
   <fieldset><legend>Lista de revisión</legend>${t.pasos.map(([nombre])=>`<label class="opcion"><input type="checkbox"> He revisado este apartado · ${nombre}</label>`).join('')}</fieldset>
   <p>Para guardar una copia, selecciona el texto y cópialo.</p>
   <button type="button" data-prev>Volver al último paso</button>`;
   panel.querySelector('textarea').value = borrador.join('\n\n');
  } else {
   const [nombre,pista,modelo] = t.pasos[actual];
   const apoyo = frases?.[actual];
   panel.innerHTML = contador(actual,t.pasos.length) +
    `<h2 id="paso-titulo" tabindex="-1">${nombre}</h2><p id="consigna-paso">${apoyo ? apoyo[0] : pista}</p>
     ${apoyo ? `<div class="estado"><p><strong>Frase para copiar</strong><br>${apoyo[1]}</p><p><strong>Ejemplo corto</strong><br>${apoyo[2]}</p><p><strong>Palabras que puedes usar</strong><br>${apoyo[3]}</p></div><button type="button" id="usar-frase">Poner la frase en mi borrador</button>` : ''}
     <label for="texto-paso"><strong>Mi borrador</strong></label>
     <textarea id="texto-paso" aria-describedby="paso-titulo consigna-paso"></textarea>
     <details><summary>Ver ejemplo de este paso</summary><p>${modelo}</p></details>
     <div class="acciones">
      ${actual ? '<button type="button" data-prev>Anterior</button>' : ''}
      <button type="button" class="primario" data-next>${actual + 1 === t.pasos.length ? 'Revisar el conjunto' : 'Siguiente paso'}</button>
     </div><p class="kicker">El borrador se conserva al pasar de un paso a otro. Copia el texto antes de salir del taller.</p>`;
   const area = panel.querySelector('textarea');
   area.value = borrador[actual];
   area.oninput = () => { borrador[actual] = area.value; };
   const usarFrase = panel.querySelector('#usar-frase');
   if (usarFrase) usarFrase.onclick = () => {
    area.value += (area.value ? '\n' : '') + apoyo[1];
    borrador[actual] = area.value;
    area.focus();
    const hueco = area.value.indexOf('___', area.value.length - apoyo[1].length);
    area.setSelectionRange(hueco,hueco+3);
   };
   panel.querySelector('[data-next]').onclick = () => { actual++; mostrar(); };
  }
  const anterior = panel.querySelector('[data-prev]');
  if (anterior) anterior.onclick = () => { actual--; mostrar(); };
  if (mover) panel.querySelector('h2').focus();
 }
 mostrar(false);
}
function fuentes() {
 main.innerHTML = cabecera('1.º de Bachillerato','Materiales de clase','Estos documentos orientan el contenido y el tipo de tareas de la aplicación.') +
 `<ul class="pasos">
 <li><strong>TEMA 1 · ¿Qué significa filosofar?</strong> y hoja de ejercicios. Preguntas filosóficas, mito y logos, arjé y razón crítica.</li>
 <li><strong>Las ramas de la filosofía.</strong> Lámina con las seis ramas y actividad de clasificación.</li>
 <li><strong>El amor · Material de clase</strong> y <strong>Actividades del Tema 2.</strong> Cuatro perspectivas, comparación, aplicación y disertación.</li>
 <li><strong>Actividad de investigación de conceptos.</strong> Ficha de neomalthusianismo y keynesianismo.</li>
 <li><strong>Guía de disertación</strong> y <strong>Un mito para comprender el presente.</strong> Pautas de escritura y exposición oral.</li>
 <li><strong>Guía docente de Filosofía de 1.º de Bachillerato.</strong> Comprensión, argumentación, contraste de fuentes, aplicación y revisión.</li>
 </ul>`;
}
function ruta(mover = false) {
 const [seccion,sub] = location.hash.slice(1).split('/');
 if (seccion === 'contenido') { main.focus(); return; }
 const u = unidades.find(item => item.id === seccion);
 let activa = seccion;
 if (u) {
  if (sub === '1' || sub === '2') cuestionario(u,Number(sub));
  else if (sub === '3') escribir(u);
  else esquema(u);
 } else if (seccion === 'examen' && Object.hasOwn(recorridosExamen,sub)) {
  practicarExamen(sub);
  activa = 'inicio';
 } else if (seccion === 'taller') {
  const t = talleres.find(item => item.id === sub);
  if (t) taller(t); else listadoTaller();
 } else if (seccion === 'fuentes') fuentes();
 else { inicio(); activa = 'inicio'; }

 for (const enlace of document.querySelectorAll('nav a')) {
  if (enlace.hash === '#' + activa) enlace.setAttribute('aria-current','page');
  else enlace.removeAttribute('aria-current');
 }
 document.title = main.querySelector('h1').textContent + ' · Filosofía de 1.º de Bachillerato';
 if (mover) { main.focus({preventScroll:true}); window.scrollTo(0,0); }
}
window.addEventListener('hashchange', () => ruta(true));
if (location.hash === '#contenido') history.replaceState(null,'','#inicio');
ruta();
document.querySelector('.salto').addEventListener('click', evento => {
 evento.preventDefault();
 main.focus();
});

</script>
</body>
</html>
