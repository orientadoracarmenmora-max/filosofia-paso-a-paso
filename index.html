{

 fuente:'TEMA 1 · ¿Qué significa filosofar? y hoja de ejercicios del tema.',
 fichas:[
 ['¿Qué significa filosofar?','Problematizar → preguntar → aclarar → justificar → objetar.','Filosofar empieza cuando nos detenemos ante algo que parecía evidente. Aclaramos qué significan las palabras, damos razones y examinamos qué podría fallar en nuestra respuesta.','Si la mayoría lo cree, ¿es verdad? La cantidad de personas que creen algo no garantiza su verdad. Una mayoría puede compartir el mismo error. Una objeción posible es que un consenso entre especialistas sí puede ser una razón para confiar, si se apoya en pruebas.'],
 ['¿Cómo se distingue mito y logos?','Mito: relato tradicional, antropomorfismo y causas divinas. Logos: razones examinables y búsqueda de causas naturales.','El tránsito fue gradual, en la Grecia de los siglos VII–VI a. C. Ambos intentaban explicar el mundo. Cambió la forma de justificar las respuestas. Una explicación razonada puede equivocarse. Mencionar una causa natural por sí sola tampoco basta: hay que explicar por qué esa causa encaja.','En el relato de Perséfone, el regreso de la hija alegra a Deméter y vuelve la vegetación. La sucesión de las estaciones se explica por las acciones y emociones de las divinidades. Una explicación científica actual estudia la inclinación del eje terrestre y cómo varía la luz que recibe cada hemisferio.'],
 ['¿Qué es el arjé?','Phýsis = naturaleza. Arjé = principio originario o fundamento común.','Tales propone el agua. Anaximandro, el ápeiron (lo indeterminado e ilimitado). Anaxímenes, el aire, que cambia mediante condensación y rarefacción. Lo importante es la pregunta común y que las respuestas se puedan examinar.','Aunque el agua no sea el origen de todo, la propuesta de Tales importa porque busca un principio general dentro de la naturaleza.'],
 ['¿Por qué en Grecia?','Contacto cultural, polis, escritura, conocimientos técnicos y diversidad religiosa.','El comercio y la navegación permitieron comparar costumbres. La escritura ayudó a conservar y discutir argumentos. La polis favoreció el debate público entre quienes tenían ciudadanía. Estas condiciones facilitaron el nacimiento de la tradición filosófica occidental.','Una explicación escrita se puede releer y comparar con otra. Eso facilita la crítica, aunque por sí solo no produzca filosofía.'],
 ['¿Ruptura o transformación?','Burnet: ruptura. Cornford: transformación. Jaeger: desarrollo gradual.','Burnet subraya la novedad de las causas naturales. Cornford destaca que el logos conserva preguntas y estructuras míticas, como la pregunta por el origen, y las transforma. Jaeger sitúa el cambio en una evolución cultural y educativa más amplia.','Mito y filosofía preguntan de dónde viene el mundo. Una genealogía divina y el arjé responden de maneras distintas. Esa continuidad apoya la lectura de Cornford.'],
 ['¿Puede la razón volver a funcionar como mito?','Adorno y Horkheimer: el mito ya intenta explicar y controlar. La razón se vuelve dogmática si deja de examinar sus fines.','La razón instrumental busca los medios más eficaces para un objetivo. La razón crítica también pregunta si ese objetivo es justo, a quién beneficia y qué consecuencias tiene. En el tema, «Ilustración» designa el proceso amplio de liberarse del miedo mediante el conocimiento.','Un sistema de vigilancia puede ser eficaz. La pregunta crítica es si vigilar de esa forma está justificado y cómo afecta a la libertad. Una promesa como «la tecnología resolverá todos los problemas» puede funcionar como mito actual si se toma como inevitable y oculta sus límites.']
 ],
 preguntas:[
 [1,'«La ira de Poseidón hizo temblar la tierra». ¿Qué tipo de explicación es?',['Logos','Mítica','Razón crítica'],1,'Atribuye el terremoto a la acción de un dios.'],
 [1,'¿Qué pregunta intenta responder la búsqueda del arjé?',['¿Qué principio explica la diversidad natural?','¿Qué dios protege cada ciudad?','¿Qué leyes tiene la polis?'],0,'Busca un principio común de la naturaleza.'],
 [1,'¿Qué propone Anaximandro?',['Aire','Agua','Ápeiron'],2,'El ápeiron es el principio indeterminado e ilimitado.'],
 [2,'El mito y los primeros filósofos preguntan por el origen del mundo, pero cambian el tipo de respuesta. ¿Qué interpretación encaja mejor?',['Cornford','Burnet','La razón instrumental'],0,'Cornford pone el acento en conservar preguntas y transformarlas racionalmente.'],
 [2,'Una persona dice que la lluvia se debe a un proceso natural, pero no explica cuál ni da razones. ¿Qué falta?',['Que la historia sea antigua','Justificar cómo ese proceso explica la lluvia','Que todos lo crean'],1,'Nombrar una causa natural no basta. La explicación tiene que poder examinarse.'],
 [2,'El centro estudia qué sistema vigila más eficazmente. ¿Qué pregunta añade la razón crítica?',['¿Cuánto tarda en instalarse?','¿Cuántas cámaras cubren el patio?','¿Es legítimo vigilar y qué pasa con la privacidad?'],2,'La razón crítica examina los fines y sus consecuencias.']
 ],
 escritura:[
 ['Pon en duda «Si la mayoría piensa algo, probablemente sea verdad».','Aclara «mayoría» y «verdad». Formula una pregunta, da una respuesta con una razón y añade una objeción.','¿Que muchas personas lo crean hace probable que sea cierto? Depende de sus razones. Si todas repiten el mismo rumor, el número no añade pruebas. Alguien podría objetar que el consenso sí cuenta cuando nace de evidencias comprobadas independientemente.','¿He formulado una pregunta? ¿Mi ejemplo apoya mi razón? ¿La objeción cuestiona de verdad la respuesta?'],
 ['Interpreta el relato de Deméter y Perséfone y compáralo con una explicación científica.','Nombra el fenómeno, las divinidades, las emociones humanas y el modo de justificar cada explicación.','El relato explica las estaciones. La pérdida de Perséfone entristece a Deméter y la tierra deja de producir. Su regreso trae de nuevo la vegetación. Es un relato tradicional con causas divinas. Una explicación científica estudia la inclinación del eje terrestre y la variación de la luz solar mediante observaciones.','¿He relacionado los hechos del relato con el fenómeno? ¿He comparado las causas y la justificación?'],
 ['¿Qué significa «paso» para Burnet, Cornford y Jaeger?','Escribe una frase por interpretación. Elige una y apóyala con el ejemplo del arjé.','Para Burnet supone una ruptura profunda en la manera de explicar. Para Cornford se transforman preguntas y estructuras anteriores. Para Jaeger es parte de un desarrollo cultural y educativo gradual. La lectura de Cornford explica que se siga preguntando por el origen, aunque el arjé se busque en la naturaleza.','¿He distinguido el cambio de la continuidad? ¿He justificado mi elección con algo del tema?']
 ]
},
{
 id:'ramas', titulo:'Ramas de la filosofía', tema:'Reconocer preguntas', resumen:'Identifica qué se pregunta y explica por qué corresponde a esa rama.',
 fuente:'Actividad · Las ramas de la filosofía y esquema visual de las seis ramas.',
 fichas:[
 ['Metafísica / Ontología','Realidad y existencia.','Pregunta qué existe y cómo es la realidad.','«¿Todo lo que existe es material?» es metafísica porque pregunta por qué clases de cosas existen.'],
 ['Epistemología','Conocimiento, verdad y justificación.','Pregunta qué podemos conocer y cómo lo sabemos.','«¿Podemos confiar en los sentidos?» es epistemología porque examina una fuente de conocimiento.'],
 ['Ética','Conducta, decisiones y vida buena.','Pregunta cómo debemos actuar y qué razones justifican lo que hacemos.','«¿Está bien mentir para ayudar?» es ética porque valora una decisión moral.'],
 ['Filosofía política','Sociedad, poder, leyes y justicia.','Pregunta cómo debemos organizar la vida en común.','«¿Cuándo es legítimo el poder?» es filosofía política porque pregunta por la justificación de la autoridad.'],

 ['Estética','Arte, belleza y experiencia estética.','Pregunta qué hace que algo sea arte o cómo experimentamos su valor.','«¿Una obra tiene que ser bella para ser arte?» es estética porque examina qué define una obra artística.']

 preguntas:[],
 escritura:[['«¿Debemos obedecer siempre las leyes?» Identifica la rama y justifica.','Completa «Pertenece a… porque pregunta por…».','Pertenece a la filosofía política porque examina cuándo una norma colectiva obliga a la ciudadanía. Puede relacionarse con la ética si nos centramos en la decisión moral individual.','¿He explicado el foco de la pregunta en una frase?']]

{
 id:'amor', titulo:'El amor', tema:'Tema 2', resumen:'Cuatro perspectivas para explicar, comparar y aplicar.',
 fuente:'El amor · Material de clase, pp. 2–12, y Actividades del Tema 2, pp. 1–2.',
 fichas:[
 ['Aristófanes · Unidad perdida','Amar es buscar la unidad perdida.','En El banquete, de Platón, Aristófanes cuenta que Zeus dividió a los seres originarios. Desde entonces cada mitad busca la unión. La separación simboliza la experiencia de falta.','«Sin ti no soy nadie» lleva la imagen de la mitad al extremo de la dependencia. Una objeción al mito es que dos personas pueden compartir su vida aun teniendo proyectos propios.'],
 ['Sócrates y Diotima · Deseo del bien y la belleza','Eros como ser intermedio · Penía y Poros · escala del amor · Belleza en sí.','Sócrates transmite la enseñanza de Diotima en El banquete. Eros, hijo de Penía (pobreza) y Poros (recurso), es intermedio: le falta lo que busca, pero tiene ingenio para buscarlo. El deseo puede educarse y aspirar al bien y a la belleza duraderos.','La escala asciende de un cuerpo bello a todos los cuerpos bellos, las almas bellas, las acciones y normas bellas, los conocimientos y la Belleza en sí. Por ejemplo, la atracción inicial puede dar paso a valorar el carácter y después lo que hace valiosa una acción.'],
 ['Schopenhauer · Voluntad de vivir','Voluntad de vivir → enamoramiento → reproducción.','Según su teoría, una fuerza ciega impulsa la conservación y la reproducción. La persona puede sentir que elige libremente, aunque el impulso que la atrae apunte a la continuidad de la especie. La satisfacción de un deseo puede ser pasajera.','Una pareja que decide no tener hijos permite preguntar cuánto explica la reproducción acerca del cuidado y el compromiso duraderos.'],
 ['Simone Weil · Atención','Atención desinteresada · hacer vacío · alteridad.','La atención desinteresada consiste en abrir espacio para su realidad, apartando por un momento nuestros deseos. Escuchar y entender es compatible con discrepar y mantener nuestros límites.','Ante un desacuerdo: «Quiero entender por qué piensas así». Esa actitud reconoce las razones de la otra persona sin exigir que cambie para satisfacerme.']
 ],
 preguntas:[
 [1,'¿Qué perspectiva explica el amor mediante la búsqueda de la unidad perdida?',['Simone Weil','Aristófanes','Schopenhauer'],1,'La separación de los seres originarios simboliza la falta y la búsqueda de unión.'],
 [1,'¿Qué representa Poros en el relato de Diotima?',['La pobreza','La reproducción','Los recursos para buscar lo que deseamos'],2,'Penía representa la falta. Poros representa el ingenio para buscar.'],
 [1,'¿Con qué concepto explica Schopenhauer el enamoramiento?',['Voluntad de vivir','Belleza en sí','Atención desinteresada'],0,'Interpreta la atracción como manifestación de la Voluntad de vivir.'],
 [2,'Escucho a mi amiga con cuidado y sigo discrepando. ¿Cómo lo interpretaría Weil?',['Comprender es compatible con discrepar','Atender obliga a darle la razón','Si discrepamos no hay atención'],0,'La atención reconoce su realidad y sus razones aunque no coincidan con las nuestras.'],
 [2,'¿En qué se parecen Aristófanes y Diotima?',['Buscan literalmente la misma mitad','Relacionan el amor con una falta','Explican todo amor por la reproducción'],1,'Comparten la idea de falta. Difieren en lo que se desea y en cómo se puede transformar el deseo.'],
 [2,'Alguien empieza valorando el físico y después aprecia el carácter y la justicia. ¿Qué idea encaja?',['Unidad perdida','Voluntad de vivir','Educación del deseo en Diotima'],2,'La escala sube desde la belleza física hacia las almas, las acciones y las normas, entre otros niveles.']
 ],
 escritura:[

const motorVoz = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window
 ? window.speechSynthesis : null;
const segmentador = typeof Intl.Segmenter === 'function'
 ? new Intl.Segmenter('es', { granularity:'sentence' }) : null;
const pausaEntreFrases = 450;
let lecturaActiva;
let voces = [];
function actualizarVoces() {
 voces = motorVoz.getVoices();
}
if (motorVoz) {
 actualizarVoces();
 motorVoz.addEventListener('voiceschanged',actualizarVoces);
}
function googleEspanol() {
 return voces.find(v=>/^es[-_]ES$/i.test(v.lang) && /google/i.test(v.name));
}
function vozAlternativa() {
 return voces.find(v=>/^es\b/i.test(v.lang) && /google/i.test(v.name))
  || voces.find(v=>/^es[-_]ES$/i.test(v.lang) && v.localService)
  || voces.find(v=>/^es[-_]ES$/i.test(v.lang)) || voces.find(v=>/^es\b/i.test(v.lang));
}
function detenerVoz() {
 const lectura = lecturaActiva;
 lecturaActiva = undefined;
 if (!lectura) return;
 window.clearTimeout(lectura.espera);
 if (lectura.alCargar) motorVoz.removeEventListener('voiceschanged',lectura.alCargar);
 motorVoz.cancel();
 lectura.estado.textContent = 'Audio detenido.';
 lectura.finalizar();
}
function leerEnVozAlta(texto,estado,finalizar) {
 detenerVoz();
 actualizarVoces();
 const frases = (segmentador
  ? Array.from(segmentador.segment(texto), item=>item.segment)
  : texto.split(/(?<=[.!?])\s+/)).map(frase=>frase.trim()).filter(Boolean);
 const lectura = { estado, espera:0, finalizar };
 lecturaActiva = lectura;
 let elegida;
 let posicion = 0;
 function leerFrase() {
  if (lecturaActiva !== lectura) return;
  const locucion = new SpeechSynthesisUtterance(frases[posicion]);
  lectura.locucion = locucion;
  if (elegida) locucion.voice = elegida;
  locucion.lang = elegida?.lang || 'es-ES';
  locucion.rate = 0.88;
  const sigueActiva = () => lecturaActiva === lectura && lectura.locucion === locucion;
  locucion.onstart = () => {
   if (!sigueActiva()) return;
   window.clearTimeout(lectura.espera);
   estado.textContent = elegida ? 'Leyendo con ' + elegida.name + '.' : 'Leyendo.';
  };
  locucion.onend = () => {
   if (!sigueActiva()) return;
   window.clearTimeout(lectura.espera);
   posicion++;
   if (posicion === frases.length) {
    lecturaActiva = undefined;
    finalizar();
    estado.textContent = elegida ? 'Lectura terminada con ' + elegida.name + '.' : 'Lectura terminada.';
   } else {
    lectura.espera = window.setTimeout(leerFrase,pausaEntreFrases);
   }
  };
  function gestionarFallo() {
   if (!sigueActiva()) return;
   window.clearTimeout(lectura.espera);
   const local = /google/i.test(elegida?.name || '') &&
    (voces.find(v=>/^es[-_]ES$/i.test(v.lang) && v.localService)
      || voces.find(v=>/^es\b/i.test(v.lang) && v.localService));
   if (local) {
    lectura.locucion = undefined;
    motorVoz.cancel();
    estado.textContent = 'Google español no responde. Probando con ' + local.name + '.';
    elegida = local;
    leerFrase();
   } else {
    lecturaActiva = undefined;
    finalizar();
    motorVoz.cancel();
    estado.textContent = elegida ? 'No se ha podido reproducir ' + elegida.name + '.' : 'No se ha podido reproducir la voz de este navegador.';
   }
  }
  locucion.onerror = gestionarFallo;
  lectura.espera = window.setTimeout(gestionarFallo,3500);
  motorVoz.speak(locucion);
 }
 function empezar() {
  if (lecturaActiva !== lectura) return;
  window.clearTimeout(lectura.espera);
  if (lectura.alCargar) motorVoz.removeEventListener('voiceschanged',lectura.alCargar);
  elegida = googleEspanol() || vozAlternativa();
  leerFrase();
 }
 if (googleEspanol()) {
  empezar();
 } else {
  estado.textContent = 'Buscando Google español…';
  lectura.alCargar = () => { if (googleEspanol()) empezar(); };
  motorVoz.addEventListener('voiceschanged',lectura.alCargar);
  lectura.espera = window.setTimeout(empezar,1100);
 }
}
function controlesAudio(contenedor,texto,etiqueta) {
 const zona = document.createElement('div');
 zona.className = 'audio';
 zona.innerHTML = `<button type="button" class="altavoz" aria-label="${etiqueta}" title="${etiqueta}"><span aria-hidden="true">🔊</span></button><span class="solo-lector" role="status"></span>`;
 contenedor.append(zona);
 const estado = zona.querySelector('[role=status]');
 const boton = zona.querySelector('button');
 const icono = boton.querySelector('span');
 function actualizarBoton(sonando) {
  boton.classList.toggle('sonando',sonando);
  boton.setAttribute('aria-label',sonando?'Detener audio':etiqueta);
  boton.title = sonando?'Detener audio':etiqueta;
  icono.textContent = sonando?'■':'🔊';
 }
 boton.onclick = () => {
  if (!motorVoz) { estado.textContent = 'Este navegador no ofrece lectura en voz alta.'; return; }
  if (lecturaActiva?.estado === estado) {
   detenerVoz();
  } else {
   actualizarBoton(true);
   leerEnVozAlta(texto,estado,()=>actualizarBoton(false));
  }
 };
}

      <button type="button" class="primario" data-next>${actual + 1 === t.pasos.length ? 'Revisar el conjunto' : 'Siguiente paso'}</button>
     </div><p class="kicker">El borrador se conserva al pasar de un paso a otro. Copia el texto antes de salir del taller.</p>`;
   controlesAudio(panel.querySelector('[data-audio-paso]'), nombre + '. ' + (apoyo ? apoyo[0] + ' ' + apoyo[1].replaceAll('___',' espacio en blanco ') : pista), 'Escuchar este paso');
   controlesAudio(panel.querySelector('.modelo-respuesta'),modelo,'Escuchar solución');
   const area = panel.querySelector('textarea');
   area.value = borrador[actual];
   area.oninput = () => { borrador[actual] = area.value; };
   const usarFrase = panel.querySelector('#usar-frase');
   if (usarFrase) usarFrase.onclick = () => {
    area.value += (area.value ? '\n' : '') + apoyo[1];
    borrador[actual] = area.value;
    area.focus();
    const hueco = area.value.indexOf('___', area.value.length - apoyo[1].length);
    area.setSelectionRange(hueco,hueco+3);
   };
   panel.querySelector('[data-next]').onclick = () => { actual++; mostrar(); };
  }
  const anterior = panel.querySelector('[data-prev]');
  if (anterior) anterior.onclick = () => { actual--; mostrar(); };
  if (mover) panel.querySelector('h2').focus();
 }
 mostrar(false);
}

(() => {
 const superficie = document.querySelector('main');
 const barra = document.querySelector('#barra-puntero');
 const panel = document.querySelector('#ajustes-puntero');
 const activar = document.querySelector('#activar-puntero');
 const abrirAjustes = document.querySelector('#abrir-ajustes-puntero');
 const lienzo = document.querySelector('#capa-puntero');
 const ctx = lienzo.getContext('2d');

 const tonos = [['Amarillo vainilla','#FFE582'],['Rosa pastel','#FFACCA'],['Melocotón pastel','#FFC395'],['Menta pastel','#A9EBC2'],['Azul cielo','#A6DDFC'],['Lila pastel','#D7B9FC']];
 try {

 } catch {}
 panel.innerHTML = `<fieldset><legend>Modo</legend>

 <label><input name="modo" type="radio" value="line"> Trazo</label></fieldset>
 <label><input name="libre" type="checkbox"> Trazo sin pulsar</label>
 <label>Estilo del rastro <select name="estilo"><option value="fine">Láser fino</option><option value="solid">Continuo</option><option value="dots">Punteado</option><option value="dashes">Discontinuo</option><option value="glow">Luminoso</option><option value="marker">Subrayador</option></select></label>
 <label>Cómo se borra <select name="borrado"><option value="auto">Según el estilo</option><option value="smooth">Suave, todo a la vez</option><option value="tail">Desde el principio, como una cola</option><option value="thin">Se afina hasta desaparecer</option><option value="cut">De golpe</option></select></label>
 <label>Color libre <input name="color" type="color"></label>
 <fieldset><legend>Tonos pastel</legend><div class="paleta-puntero">${tonos.map(([nombre,color])=>`<button type="button" aria-label="${nombre}" title="${nombre}" data-tono="${color}" style="--tono:${color}"></button>`).join('')}</div></fieldset>
 <label>Tamaño <input name="ancho" type="range" min="4" max="45" step="1"><output data-valor="ancho"></output></label>
 <label>Opacidad <input name="opacidad" type="range" min="10" max="100" step="1"><output data-valor="opacidad"></output></label>
 <label>Duración del rastro <input name="duracion" type="range" min=".2" max="8" step=".1"><output data-valor="duracion"></output></label>
 <div class="muestra-puntero"><span>Texto de ejemplo del subrayador</span></div>
 <p>Con la página enfocada, usa las flechas para señalar y Escape para borrar el rastro.</p>`;

 let activo = false;
 let cuadro = 0;
 let punto;
 let trazos = [];
 let trazo;
 let teclado;
 let gesto;
 let suprimirClic = false;
 const duracion = () => ajustes.duracion * 1000;
 const limitar = (n,min=0,max=1) => Math.max(min,Math.min(max,n));
 function actualizarAjustes() {
  for (const campo of panel.querySelectorAll('[name]')) {
   const valor = ajustes[campo.name];
   if (campo.type === 'radio') campo.checked = campo.value === valor;
   else if (campo.type === 'checkbox') campo.checked = valor;
   else campo.value = valor;
  }
  for (const [nombre,unidad] of [['ancho','px'],['opacidad','%'],['duracion','s']]) {
   panel.querySelector(`[data-valor="${nombre}"]`).value = ajustes[nombre]+' '+unidad;
  }
  panel.querySelectorAll('[data-tono]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tono.toLowerCase()===ajustes.color.toLowerCase())));

  muestra.style.setProperty('--color-muestra',ajustes.color);
  muestra.style.setProperty('--altura-muestra',ajustes.ancho+'px');
  muestra.style.setProperty('--opacidad-muestra',ajustes.opacidad/100);

 }
 function cambiar(nombre,valor) {
  ajustes[nombre] = valor;
  try {localStorage.setItem(clave,JSON.stringify(ajustes));} catch {}
  limpiar();
  actualizarAjustes();
 }
 panel.addEventListener('input',e=>{
  const c = e.target;
  if (!c.name) return;
  cambiar(c.name,c.type==='checkbox'?c.checked:c.type==='range'?Number(c.value):c.value);
 });
 panel.addEventListener('click',e=>{
  const tono=e.target.closest('[data-tono]');
  if(tono) cambiar('color',tono.dataset.tono);
 });
 function limpiar() {
  cancelAnimationFrame(cuadro);
  cuadro=0;
  trazos=[];
  trazo=punto=teclado=undefined;
  if(gesto && superficie.hasPointerCapture(gesto.id)) superficie.releasePointerCapture(gesto.id);
  gesto=undefined;
  ctx.clearRect(0,0,lienzo.width,lienzo.height);
 }
 function activarPuntero(valor) {
  activo=valor;
  activar.setAttribute('aria-pressed',String(activo));
  superficie.classList.toggle('puntero-activo',activo);
  lienzo.hidden=!activo;
  limpiar();
  if(activo) superficie.focus({preventScroll:true});
 }
 activar.onclick=()=>activarPuntero(!activo);
 abrirAjustes.onclick=()=>{
  panel.hidden=!panel.hidden;
  abrirAjustes.setAttribute('aria-expanded',String(!panel.hidden));
 };
 function pedirCuadro() {
  if(!cuadro) cuadro=requestAnimationFrame(dibujar);
 }
 function linea(puntos,alpha,factor,distancia) {
  if(alpha<=0 || factor<=0) return;
  const ancho=ajustes.ancho;
  const estilo=ajustes.estilo;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=ajustes.color;
  ctx.lineWidth=(estilo==='fine'?Math.max(1.5,ancho*.36):ancho)*factor;
  ctx.lineCap=estilo==='marker'?'square':'round';
  ctx.lineJoin='round';
  if(estilo==='fine'||estilo==='glow'){
   ctx.shadowColor=ajustes.color;
   ctx.shadowBlur=ancho*factor*(estilo==='fine'?.35:1);
  }
  if(estilo==='dots'||estilo==='dashes'){
   ctx.setLineDash([estilo==='dots'?.15:ancho*1.65,ancho*1.7]);
   ctx.lineDashOffset=-distancia;
  }
  ctx.beginPath();
  ctx.moveTo(puntos[0].x,puntos[0].y);
  if(puntos.length===1) ctx.lineTo(puntos[0].x+.01,puntos[0].y);
  for(const p of puntos.slice(1)) ctx.lineTo(p.x,p.y);
  ctx.stroke();
  if(estilo==='fine'){
   ctx.shadowBlur=0;
   ctx.strokeStyle='#fff';
   ctx.lineWidth=Math.max(.5*factor,ctx.lineWidth*.40);
   ctx.stroke();
  }
  ctx.restore();
 }
 function dibujar(ahora) {
  cuadro=0;
  const ratio=Math.min(devicePixelRatio||1,2);
  const ancho=innerWidth, alto=innerHeight;
  if(lienzo.width!==Math.round(ancho*ratio)||lienzo.height!==Math.round(alto*ratio)){
   lienzo.width=Math.round(ancho*ratio);
   lienzo.height=Math.round(alto*ratio);
  }
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.clearRect(0,0,ancho,alto);
  const r=superficie.getBoundingClientRect();
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.left,r.top,r.width,r.height);
  ctx.clip();
  const opacidad=ajustes.opacidad/100;
  const efecto=ajustes.borrado==='auto'?(ajustes.estilo==='fine'?'smooth':'tail'):ajustes.borrado;
  for(const paso of trazos){
   const {puntos,ultimo}=paso;
   if(efecto==='tail'){
    while(puntos.length>1 && ahora-puntos[1].tiempo>=duracion()) puntos.shift();
    const grupos=new Map();
    for(let n=0;n<puntos.length;n++){
     const p=puntos[n];
     const alpha=Math.round(16*limitar((1-(ahora-p.tiempo)/duracion())/.45))/16;
     if(!alpha) continue;
     const previo=puntos[Math.max(0,n-1)];
     const grupo=grupos.get(alpha);
     if(grupo) grupo.puntos.push(p);
     else grupos.set(alpha,{puntos:previo===p?[p]:[previo,p],distancia:previo.distancia});
    }
    for(const [alpha,g] of grupos) linea(g.puntos,opacidad*alpha,1,g.distancia);
   }else{
    const edad=paso===trazo && gesto ? 0 : ahora-ultimo;
    const restante=limitar(1-edad/duracion());
    const alpha=efecto==='cut'?Number(restante>0):limitar(restante/.7);
    linea(puntos,opacidad*alpha,efecto==='thin'?alpha:1,0);
   }
  }
  trazos=trazos.filter(paso=>(paso===trazo && gesto)||ahora-paso.ultimo<duracion());
  if(trazo&&!trazos.includes(trazo)) trazo=undefined;
  if(punto){
   const restante=punto.fijo?1:limitar(1-(ahora-punto.tiempo)/duracion());
   ctx.globalAlpha=opacidad*limitar(restante/.3);
   ctx.fillStyle=ajustes.color;
   ctx.shadowColor=ajustes.color;
   ctx.shadowBlur=8;
   ctx.strokeStyle='#fff';
   ctx.lineWidth=1.5;
   ctx.beginPath();
   ctx.arc(punto.x,punto.y,ajustes.ancho/2,0,Math.PI*2);

  }

 function colocar(x,y,fijo=false) {
  const tiempo=performance.now();
  if(ajustes.modo==='dot') punto={x,y,tiempo,fijo};
  else {
   if(!trazo || (!gesto && tiempo-trazo.ultimo>=duracion())){
    trazo={puntos:[],ultimo:tiempo};
    trazos.push(trazo);
   }
   const anterior=trazo.puntos.at(-1);
   const distancia=anterior?anterior.distancia+Math.hypot(x-anterior.x,y-anterior.y):0;
   if(!anterior || x!==anterior.x || y!==anterior.y) trazo.puntos.push({x,y,tiempo,distancia});
   trazo.ultimo=tiempo;
  }
  pedirCuadro();
 }
 function salir() {
  trazo=undefined;
  if(punto?.fijo) {
   punto.fijo=false;
   punto.tiempo=performance.now();
   pedirCuadro();
  }
 }
 const controles='a,button,input,textarea,select,summary,label,[contenteditable]';
 superficie.addEventListener('pointerdown',e=>{

  gesto={id:e.pointerId};
  suprimirClic=true;
  superficie.setPointerCapture(e.pointerId);
  colocar(e.clientX,e.clientY,true);
 });
 superficie.addEventListener('pointermove',e=>{
  if(!activo) return;
  const caja=superficie.getBoundingClientRect();
  if(e.clientX<caja.left||e.clientX>=caja.right||e.clientY<caja.top||e.clientY>=caja.bottom){salir();return;}
  if(gesto?.id===e.pointerId || (e.pointerType!=='touch'&&(ajustes.modo==='dot'||ajustes.libre))) {
   colocar(e.clientX,e.clientY,true);
  }
 });
 superficie.addEventListener('pointerleave',salir);
 for(const tipo of ['pointerup','pointercancel','lostpointercapture']) superficie.addEventListener(tipo,e=>{
  if(gesto?.id!==e.pointerId) return;
  gesto=undefined;
  if(e.pointerType==='touch'||tipo==='pointercancel') salir();
  else trazo=undefined;
  setTimeout(()=>{suprimirClic=false;},0);
 });
 superficie.addEventListener('click',e=>{
  if(suprimirClic){e.preventDefault();e.stopPropagation();}
 },true);
 superficie.addEventListener('keydown',e=>{
  if(!activo||e.target!==superficie) return;

 });

 window.addEventListener('blur',salir);
 for(const evento of ['resize','scroll','hashchange','beforeprint']) window.addEventListener(evento,limpiar);
 barra.removeAttribute('hidden');
 actualizarAjustes();
})();
